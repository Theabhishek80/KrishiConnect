spring:
  application:
    name: krishiconnect

  # Load local .env files during development if they exist
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    # Railway uses DATABASE_URL
    # Local fallback is PostgreSQL on localhost
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/krishiconnect}

    username: ${DATABASE_USERNAME:postgres}

    password: ${DATABASE_PASSWORD:postgres}

    # ==========================================================
    # HIKARI CONNECTION POOL
    # Added to prevent Aiven PostgreSQL connection exhaustion
    # ==========================================================
    hikari:
      # Maximum number of DB connections this backend can use
      maximum-pool-size: 5

      # Keep only 1 idle connection when traffic is low
      minimum-idle: 1

      # Wait up to 20 seconds for a connection
      connection-timeout: 20000

      # Close idle connections after 5 minutes
      idle-timeout: 300000

      # Recycle connections every 30 minutes
      max-lifetime: 1800000


  jpa:
    # Prevent lazy-loading DB connections from remaining open
    # after a request has completed
    open-in-view: false

    hibernate:
      # Database structure is controlled by Flyway
      ddl-auto: validate

    properties:
      hibernate:
        # Store/read timestamps in UTC
        jdbc.time_zone: UTC


  # Database migrations
  flyway:
    enabled: true


  # ==========================================================
  # EMAIL CONFIGURATION
  # ==========================================================
  mail:
    host: ${MAIL_HOST:localhost}

    port: ${MAIL_PORT:1025}

    username: ${MAIL_USERNAME:}

    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}

          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}


  # ==========================================================
  # FILE UPLOAD LIMITS
  # ==========================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


# ==========================================================
# SERVER
# ==========================================================
server:
  # Railway provides PORT automatically
  # Local development uses 8080
  port: ${PORT:8080}


# ==========================================================
# APPLICATION CONFIGURATION
# ==========================================================
app:

  # ========================================================
  # JWT
  # ========================================================
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-please}

    # Access token validity
    access-minutes: 30

    # Refresh token validity
    refresh-days: 14


  # ========================================================
  # FRONTEND
  # ========================================================
  frontend-url: ${FRONTEND_URL:http://localhost:5173}


  # ========================================================
  # EMAIL SENDER
  # ========================================================
  mail-from: ${MAIL_FROM:noreply@krishiconnect.local}


  # ========================================================
  # ADMIN ACCOUNT
  # ========================================================
  admin:
    email: ${ADMIN_EMAIL:admin@krishiconnect.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}


  # ========================================================
  # OPENROUTER AI
  # ========================================================
  #
  # Railway variables:
  #
  # OPENROUTER_API_KEY=your_real_key
  # OPENROUTER_MODEL=openrouter/free
  #
  # Never put the real API key directly in this file.
  #
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openrouter/free}


  # ========================================================
  # MANDI RATES
  # ========================================================
  #
  # Railway variable:
  #
  # MANDI_API_KEY=your_data_gov_in_api_key
  #
  # This is used by MandiService to access data.gov.in.
  #
  mandi:
    api-key: ${MANDI_API_KEY:}


# ==========================================================
# SWAGGER / OPENAPI
# ==========================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
