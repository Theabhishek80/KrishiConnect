spring:
  application:
    name: krishiconnect

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/krishiconnect}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: ${PORT:8080}


app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-please}
    access-minutes: 30
    refresh-days: 14

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail-from: ${MAIL_FROM:noreply@krishiconnect.local}

  admin:
    email: ${ADMIN_EMAIL:admin@krishiconnect.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openrouter/free}

  mandi:
    api-key: ${MANDI_API_KEY:}


springdoc:
  swagger-ui:
    path: /swagger-ui.html
