<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#2e7d32" />

    <!-- Primary SEO -->
    <title>
      KisanDirect | Fresh Farm Products Directly From Farmers
    </title>

    <meta
      name="description"
      content="KisanDirect connects customers directly with farmers to discover and buy fresh farm products. Explore fresh produce, recipes, mandi information, farming resources and more."
    />

    <meta
      name="keywords"
      content="KisanDirect, farmers, fresh farm products, buy from farmers, farmer marketplace, agricultural marketplace, fresh vegetables, fresh fruits, mandi, farming, India farmers"
    />

    <meta name="author" content="KisanDirect" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.kisandirect.online/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="KisanDirect | Fresh Farm Products Directly From Farmers"
    />

    <meta
      property="og:description"
      content="Discover and buy fresh farm products directly from farmers with KisanDirect."
    />

    <meta
      property="og:url"
      content="https://www.kisandirect.online/"
    />

    <meta
      property="og:site_name"
      content="KisanDirect"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!--
      If you have a proper social sharing image,
      you can uncomment and update this:
      
      <meta
        property="og:image"
        content="https://www.kisandirect.online/og-image.png"
      />
    -->

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="KisanDirect | Fresh Farm Products Directly From Farmers"
    />

    <meta
      name="twitter:description"
      content="Discover and buy fresh farm products directly from farmers with KisanDirect."
    />

    <!--
      If you have a social sharing image:
      
      <meta
        name="twitter:image"
        content="https://www.kisandirect.online/og-image.png"
      />
    -->

    <!-- WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.kisandirect.online/#website",
        "name": "KisanDirect",
        "url": "https://www.kisandirect.online/",
        "description": "KisanDirect connects customers directly with farmers to discover and buy fresh farm products.",
        "publisher": {
          "@id": "https://www.kisandirect.online/#organization"
        }
      }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.kisandirect.online/#organization",
        "name": "KisanDirect",
        "url": "https://www.kisandirect.online/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.kisandirect.online/favicon.png"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use KisanDirect.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
