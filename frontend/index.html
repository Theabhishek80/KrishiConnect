<!doctype html>
<html lang="en-IN">
  <head>
    <!-- =========================
         BASIC / PERFORMANCE
    ========================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#2e7d32"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <!-- =========================
         PRIMARY SEO
    ========================== -->

    <title>
      KisanDirect | Fresh Farm Products Directly From Farmers
    </title>

    <meta
      name="description"
      content="KisanDirect connects customers directly with farmers to discover and buy fresh farm products. Explore fresh produce, recipes, mandi information, farming resources and more."
    />

    <meta
      name="author"
      content="KisanDirect"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Homepage canonical -->
    <link
      rel="canonical"
      href="https://www.kisandirect.online/"
    />

    <!-- =========================
         FAVICON
    ========================== -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- =========================
         OPEN GRAPH
    ========================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="KisanDirect | Fresh Farm Products Directly From Farmers"
    />

    <meta
      property="og:description"
      content="Discover and buy fresh farm products directly from farmers with KisanDirect."
    />

    <meta
      property="og:url"
      content="https://www.kisandirect.online/"
    />

    <meta
      property="og:site_name"
      content="KisanDirect"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!--
      Add this after we create the official social sharing image:

      <meta
        property="og:image"
        content="https://www.kisandirect.online/og-image.png"
      />

      <meta
        property="og:image:alt"
        content="KisanDirect - Fresh farm products directly from farmers"
      />
    -->

    <!-- =========================
         X / TWITTER
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="KisanDirect | Fresh Farm Products Directly From Farmers"
    />

    <meta
      name="twitter:description"
      content="Discover and buy fresh farm products directly from farmers with KisanDirect."
    />

    <!--
      Add after creating the official social sharing image:

      <meta
        name="twitter:image"
        content="https://www.kisandirect.online/og-image.png"
      />

      <meta
        name="twitter:image:alt"
        content="KisanDirect - Fresh farm products directly from farmers"
      />
    -->

    <!-- =========================
         WEBSITE STRUCTURED DATA
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.kisandirect.online/#website",
        "name": "KisanDirect",
        "url": "https://www.kisandirect.online/",
        "description": "KisanDirect connects customers directly with farmers to discover and buy fresh farm products.",
        "inLanguage": "en-IN",
        "publisher": {
          "@id": "https://www.kisandirect.online/#organization"
        }
      }
    </script>

    <!-- =========================
         ORGANIZATION STRUCTURED DATA
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.kisandirect.online/#organization",
        "name": "KisanDirect",
        "url": "https://www.kisandirect.online/",
        "description": "KisanDirect is a farm marketplace connecting customers with farmers and fresh agricultural products.",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.kisandirect.online/favicon.png"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use KisanDirect.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
